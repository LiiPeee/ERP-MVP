name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  JAVA_DISTRIBUTION: temurin

jobs:
  build-and-test:
    name: Build e testes
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: ./mvnw verify
        working-directory: backend-java
        run: ./mvnw --batch-mode --no-transfer-progress verify

  secret-scan:
    name: Varredura de segredos
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Baixar gitleaks com hash conferido
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check
          tar --extract --gzip --file "$archive" gitleaks
      - name: Varrer todo o histórico
        run: ./gitleaks git --redact --no-banner --exit-code 1 .

  dependency-scan:
    name: Varredura de dependências
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        working-directory: backend-java
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests package dependency-check:aggregate
      - name: Guardar relatório
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-check-report
          path: backend-java/target/dependency-check-report.html
          if-no-files-found: ignore

  frontend:
    name: Frontend (build e testes)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend-angular
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.3"
          cache: npm
          cache-dependency-path: frontend-angular/package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run build
      - name: Auditoria de dependências de produção
        run: npm audit --omit=dev --audit-level=high

  openapi-client:
    name: Cliente OpenAPI em dia
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Gerar o cliente a partir de openapi/openapi.json
        working-directory: backend-java
        run: ./mvnw --batch-mode --no-transfer-progress -N -Pgenerate-client generate-sources
      - name: O cliente versionado precisa ser igual ao gerado
        run: git diff --exit-code -- frontend-angular/src/app/api

  e2e:
    name: Ponta a ponta (Playwright)
    runs-on: ubuntu-24.04
    needs: [build-and-test, frontend]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.3"
      - name: "Subir a aplicação completa (limites altos porque o teste cria várias contas)"
        env:
          ERP_WEB_RATE_LIMIT_REGISTER_PER_IP: "1000"
          ERP_WEB_RATE_LIMIT_LOGIN_PER_IP: "1000"
          ERP_WEB_RATE_LIMIT_LOGIN_PER_EMAIL: "1000"
        run: docker compose --env-file .env.example up --build --detach --wait --wait-timeout 600
      - name: Instalar o Playwright e o Chromium
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Rodar o fluxo
        working-directory: e2e
        run: npx playwright test
      - name: Guardar o relatório se falhar
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces
          path: e2e/test-results
          if-no-files-found: ignore
