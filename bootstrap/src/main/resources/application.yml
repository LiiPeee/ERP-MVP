spring:
  application:
    name: erp-core
  datasource:
    url: ${ERP_DB_URL}
    username: ${ERP_DB_APP_USER}
    password: ${ERP_DB_APP_PASSWORD}
  flyway:
    user: ${ERP_DB_MIGRATOR_USER}
    password: ${ERP_DB_MIGRATOR_PASSWORD}
    placeholders:
      app_role: ${ERP_DB_APP_USER}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

logging:
  level:
    # Estes pacotes imprimem o conteúdo de entidades, parâmetros e SQL quando em DEBUG/TRACE: ficam travados em
    # WARN para dado pessoal nunca ir para o log, mesmo que alguém aumente o nível raiz. Um teste confere.
    org.hibernate: warn
    org.springframework.orm: warn
    org.springframework.jdbc: warn
    org.springframework.data: warn
    # Em DEBUG estes registram a URL com a query string (que pode ter e-mail, CPF...).
    org.springframework.security: info
    org.springframework.web: info
    org.apache: info
    com.zaxxer.hikari: info
  structured:
    format:
      console: logstash
    json:
      customizer: br.com.erpcore.adapter.infra.logging.PersonalDataMaskingCustomizer

# O contrato OpenAPI só é exposto quando ligado de propósito (testes e geração do cliente).
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
