name: erp-core

services:
  postgres:
    image: postgres:18.7-alpine
    environment:
      POSTGRES_DB: ${ERP_DB_NAME:?defina ERP_DB_NAME no .env}
      POSTGRES_USER: ${ERP_DB_SUPERUSER:?defina ERP_DB_SUPERUSER no .env}
      POSTGRES_PASSWORD: ${ERP_DB_SUPERUSER_PASSWORD:?defina ERP_DB_SUPERUSER_PASSWORD no .env}
      ERP_DB_MIGRATOR_USER: ${ERP_DB_MIGRATOR_USER:?defina ERP_DB_MIGRATOR_USER no .env}
      ERP_DB_MIGRATOR_PASSWORD: ${ERP_DB_MIGRATOR_PASSWORD:?defina ERP_DB_MIGRATOR_PASSWORD no .env}
      ERP_DB_APP_USER: ${ERP_DB_APP_USER:?defina ERP_DB_APP_USER no .env}
      ERP_DB_APP_PASSWORD: ${ERP_DB_APP_PASSWORD:?defina ERP_DB_APP_PASSWORD no .env}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      # Via TCP de propósito: durante a inicialização o servidor temporário só escuta no socket local.
      test: ["CMD-SHELL", "pg_isready --host 127.0.0.1 --username \"$$POSTGRES_USER\" --dbname \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      ERP_DB_URL: jdbc:postgresql://postgres:5432/${ERP_DB_NAME}
      ERP_DB_MIGRATOR_USER: ${ERP_DB_MIGRATOR_USER}
      ERP_DB_MIGRATOR_PASSWORD: ${ERP_DB_MIGRATOR_PASSWORD}
      ERP_DB_APP_USER: ${ERP_DB_APP_USER}
      ERP_DB_APP_PASSWORD: ${ERP_DB_APP_PASSWORD}
      # Sem estas chaves a aplicação não sobe. Para trocar a chave sem derrubar sessões, adicione a nova
      # (ERP_SECURITY_JWT_KEYS_K2), aponte a ativa para ela e remova a antiga quando os tokens antigos expirarem.
      ERP_SECURITY_JWT_ACTIVE_KEY_ID: ${ERP_SECURITY_JWT_ACTIVE_KEY_ID:?defina ERP_SECURITY_JWT_ACTIVE_KEY_ID no .env}
      ERP_SECURITY_JWT_KEYS_K1: ${ERP_SECURITY_JWT_KEYS_K1:?defina ERP_SECURITY_JWT_KEYS_K1 no .env}
      # Criptografia de campo (telefone, e-mail, placa). Rotação: ver docs/seguranca.md.
      ERP_SECURITY_FIELD_ACTIVE_KEY_ID: ${ERP_SECURITY_FIELD_ACTIVE_KEY_ID:?defina ERP_SECURITY_FIELD_ACTIVE_KEY_ID no .env}
      ERP_SECURITY_FIELD_KEYS_K1: ${ERP_SECURITY_FIELD_KEYS_K1:?defina ERP_SECURITY_FIELD_KEYS_K1 no .env}
      ERP_SECURITY_FIELD_BLIND_INDEX_KEY: ${ERP_SECURITY_FIELD_BLIND_INDEX_KEY:?defina ERP_SECURITY_FIELD_BLIND_INDEX_KEY no .env}
      # Limites das rotas públicas (padrões seguros). Os testes ponta a ponta criam várias contas e sobem estes valores.
      ERP_WEB_RATE_LIMIT_REGISTER_PER_IP: ${ERP_WEB_RATE_LIMIT_REGISTER_PER_IP:-5}
      ERP_WEB_RATE_LIMIT_LOGIN_PER_IP: ${ERP_WEB_RATE_LIMIT_LOGIN_PER_IP:-10}
      ERP_WEB_RATE_LIMIT_LOGIN_PER_EMAIL: ${ERP_WEB_RATE_LIMIT_LOGIN_PER_EMAIL:-5}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s

volumes:
  postgres-data:
